[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/zeros-supervisord.pid

[program:backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 1 --ws-max-size 4096
directory=/app
user=zeros
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
